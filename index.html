<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#26301F">
<title>Ждём дембель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>

  <header class="hero">
    <p class="hello">Привет, <span id="her"></span></p>
    <div class="days"><span id="days">0</span><small id="daysLabel">дней до дембеля</small></div>
    <p class="clock" id="clock">00:00:00</p>
    <div class="tape-wrap"><svg id="tape" viewBox="0 0 1000 110" role="img" aria-label="Дембельская лента"></svg></div>
    <p class="tape-cap" id="tapeCap"></p>
    <div class="progress"><div id="bar"></div></div>
    <p class="served" id="served"></p>
  </header>

  <h2>Записка дня</h2>
  <section class="paper note">
    <p class="note-text" id="noteText"></p>
    <p class="note-date" id="noteDate"></p>
  </section>

  <h2>Письма</h2>
  <section class="letters" id="letters"></section>

  <h2>Банка причин</h2>
  <section class="jar-box">
    <button class="jar" id="jar" aria-label="Достать причину">
      <svg viewBox="0 0 120 150" width="130" aria-hidden="true">
        <rect x="30" y="6" width="60" height="16" rx="3" fill="#C9A24A"/>
        <path d="M34 22h52v10q18 8 18 30v68q0 16-16 16H32q-16 0-16-16V62q0-22 18-30z" fill="rgba(237,227,204,.07)" stroke="#EDE3CC" stroke-width="3"/>
        <g fill="#E0506E">
          <path transform="translate(30 112)" d="M0 3C0-1 6-1 6 3 6-1 12-1 12 3 12 8 6 11 6 12 6 11 0 8 0 3Z"/>
          <path transform="translate(58 98) rotate(20)" d="M0 3C0-1 6-1 6 3 6-1 12-1 12 3 12 8 6 11 6 12 6 11 0 8 0 3Z"/>
          <path transform="translate(76 118) rotate(-15)" d="M0 3C0-1 6-1 6 3 6-1 12-1 12 3 12 8 6 11 6 12 6 11 0 8 0 3Z"/>
        </g>
        <g fill="#EDE3CC">
          <rect x="44" y="118" width="18" height="10" rx="1" transform="rotate(-12 53 123)"/>
          <rect x="72" y="88" width="18" height="10" rx="1" transform="rotate(18 81 93)"/>
          <rect x="34" y="88" width="18" height="10" rx="1" transform="rotate(6 43 93)"/>
        </g>
      </svg>
    </button>
    <p class="reason" id="reason">Нажми на банку</p>
  </section>

  <h2>Когда вернусь</h2>
  <ul class="plans" id="plans"></ul>

  <h2>Как ты сегодня?</h2>
  <section>
    <div class="moods" id="moods"></div>
    <div class="cal" id="cal"></div>
  </section>

  <h2>Игры</h2>
  <section class="games">
    <div class="game"><i>🃏</i>Мемори<br><small>скоро</small></div>
    <div class="game"><i>🧩</i>Пазл<br><small>скоро</small></div>
    <div class="game"><i>🪖</i>Солдатик<br><small>скоро</small></div>
  </section>

  <footer>Жди меня, и я вернусь</footer>
</main>

<dialog id="dlg">
  <article class="paper letter">
    <h3 id="dlgTitle"></h3>
    <p id="dlgBody"></p>
    <button id="dlgClose" class="close">Закрыть</button>
  </article>
</dialog>

<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
